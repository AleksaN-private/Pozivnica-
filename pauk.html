<!doctype html>
<html lang="sr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Pauk — Wikipedia crawler</title>
<style>
:root{--bg:#050a10;--cy:#3df0ff;--cy2:#1a8fa0;--am:#ffb347;--tx:#bfeaf0;--dim:#4d7a85}
*{box-sizing:border-box;margin:0}
body{background:radial-gradient(ellipse at 60% 40%,#0a1a26,#050a10 70%);color:var(--tx);font:13px/1.5 ui-monospace,Consolas,monospace;height:100vh;overflow:hidden;display:grid;grid-template-columns:1fr 1.1fr;grid-template-rows:44px 1fr 34px;gap:10px;padding:10px}
body:before{content:"";position:fixed;inset:0;background:repeating-linear-gradient(0deg,#0000 0 3px,#3df0ff08 3px 4px);pointer-events:none}
.p{position:relative;background:linear-gradient(160deg,#0b2230cc,#07141dcc);border:1px solid var(--cy2);
 clip-path:polygon(14px 0,100% 0,100% calc(100% - 14px),calc(100% - 14px) 100%,0 100%,0 14px);padding:12px 16px;overflow:hidden;backdrop-filter:blur(6px)}
.p>h2{font-size:11px;letter-spacing:.2em;color:var(--cy);margin-bottom:8px;text-transform:uppercase}
.top{grid-column:1/3;display:flex;align-items:center;gap:14px;padding:6px 16px}
.top b{color:var(--cy);letter-spacing:.3em}
.top input{flex:1;background:#0006;border:1px solid var(--cy2);color:var(--tx);padding:5px 10px;font:inherit}
.top button{background:var(--cy2);color:#001;border:0;padding:6px 14px;font:inherit;font-weight:700;cursor:pointer}
.stat{color:var(--dim)}.stat em{color:var(--am);font-style:normal}
.txt{line-height:2.6;font-size:17px;color:#8fb8c0}
.lp{display:flex;flex-direction:column}.lp .txtwrap{flex:1;min-height:0}#cv{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:3}
.txt a{transition:all .3s}.txt a.glow{color:#fff;background:#3df0ff44;box-shadow:0 0 14px var(--cy);border-color:#fff}.txt a.opened{color:#201000;background:var(--am);box-shadow:0 0 18px var(--am);border-color:var(--am)}
.txt a{color:var(--cy);border-bottom:1px solid var(--cy2);text-decoration:none}
.txt a.vis{color:var(--am);border-color:var(--am)}
.txt .cur{background:#3df0ff33;outline:1px solid var(--cy);padding:0 2px}
.left{display:grid;grid-template-rows:1fr 150px;gap:10px;min-height:0}
svg{width:100%;height:100%}
.ring{fill:none;stroke:#3df0ff22;stroke-dasharray:3 5}
.ed{stroke:#3df0ff55;stroke-width:1}
.nd{fill:#07141d;stroke:var(--cy);stroke-width:1.5}
.nd.act{stroke:var(--am);animation:pl 1.2s infinite}
.nd.done{fill:#3df0ff33}
.nd.home{fill:#ffb34733;stroke:var(--am);stroke-width:2.5}
text{fill:var(--tx);font-size:9px}
@keyframes pl{50%{stroke-width:4;stroke-opacity:.4}}
.log div{color:var(--dim);font-size:11px}.log span{color:var(--cy)}
.foot{grid-column:1/3;display:flex;gap:24px;align-items:center;padding:4px 16px}
.foot input{accent-color:var(--cy)}
.pop{position:absolute;right:3%;bottom:8%;width:min(560px,46vw);z-index:5;border-color:var(--am);box-shadow:0 0 40px #ffb34733}
.pop h2{color:var(--am)}
.sp{display:inline-block;width:9px;height:9px;background:var(--am);border-radius:50%;box-shadow:0 0 10px var(--am);vertical-align:middle;animation:pl 1s infinite}
.foot button{background:#0006;border:1px solid var(--cy2);color:var(--tx);font:inherit;padding:2px 10px;cursor:pointer}.pop .txtwrap{min-height:300px}.pop .txt{font-size:15px;line-height:2.3}.vn text{pointer-events:none}.note{position:fixed;right:14px;bottom:44px;background:#000a;border:1px dashed var(--dim);padding:6px 10px;font-size:11px;color:var(--dim);z-index:9}

.txtwrap{position:relative}
.spider{position:absolute;width:64px;height:64px;margin:-42px 0 0 -32px;pointer-events:none;z-index:3;transition:left 1.6s cubic-bezier(.5,0,.3,1),top 1.6s cubic-bezier(.5,0,.3,1);filter:drop-shadow(0 0 6px var(--am))}
.spider .lg{stroke:var(--am);stroke-width:1.6;fill:none;stroke-linecap:round;transform-origin:23px 23px;animation:wg .35s infinite alternate}
.spider .lg.b{animation-delay:.17s}
.spider .bd{fill:#2a1a05;stroke:var(--am);stroke-width:1.5}
.spider .ey{fill:var(--cy)}
@keyframes wg{from{transform:rotate(-7deg)}to{transform:rotate(7deg)}}
.sc{background:#3df0ff22;box-shadow:0 1px 0 var(--cy)}
.trail{position:absolute;height:2px;background:linear-gradient(90deg,transparent,var(--am));pointer-events:none}
.vn{cursor:pointer}.vn circle{fill:#07141d;stroke:var(--cy);stroke-width:1.5;transform-box:fill-box;transform-origin:center;animation:pop .5s ease-out}
.vn.act circle{stroke:var(--am);animation:pop .5s ease-out,pl 1s .5s infinite}.vn.done circle{fill:#3df0ff44}.vn.err circle{stroke:#f55;fill:#f553}.vn:hover circle{stroke:#fff}
.ed2{stroke:#3df0ff66;stroke-width:1;stroke-dasharray:var(--l);stroke-dashoffset:var(--l);animation:dr .6s forwards}.ed2.dup{stroke:var(--am);stroke-opacity:.8}
@keyframes dr{to{stroke-dashoffset:0}}@keyframes pop{from{transform:scale(0)}}
.xbtn{float:right;cursor:pointer;color:var(--am)}
.alt{color:var(--cy);cursor:pointer;border-bottom:1px solid var(--cy2)}.log{scrollbar-color:var(--cy2) transparent;scrollbar-width:thin}</style>
</head>
<body>
<div class="p top">
 <b>◈ PAUK</b>
 <input id="q" value="Nikola Tesla" placeholder="reč ili rečenica…" aria-label="Pojam za pretragu">
 <select id="lg" style="background:#0006;color:var(--tx);border:1px solid var(--cy2);padding:5px"><option value="sr">sr.wikipedia</option><option value="en">en.wikipedia</option></select>
 <button id="go">POKRENI</button>
 <span class="stat">paukova <em id="sA">0</em> · čvorova <em id="sN">0</em> · veza <em id="sE">0</em> · dubina <em id="sD">0</em></span>
</div>
<div class="left">
 <div class="p lp"><h2>◢ Glavni pauk — <span id="ht"></span> <span class="sp"></span></h2>
  <div class="txtwrap" id="mainwrap"></div></div>
 <div class="p log" style="overflow:auto"><h2>◢ Dnevnik</h2><div id="lg2"></div></div>
</div>
<div class="p"><h2>◢ Mreža — radar po dubini (klik na čvor = prozor u tog pauka)</h2>
 <svg viewBox="0 0 600 460"><g transform="translate(300 230)"><circle class="ring" r="60"/><circle class="ring" r="120"/><circle class="ring" r="180"/><circle class="ring" r="225"/><g id="eg"></g><g id="vg"></g></g></svg>
</div>
<div class="p pop" id="pop" style="display:none"><h2><span id="ph"></span><span class="xbtn" id="px">✕ zatvori — pauk nastavlja</span></h2><div class="txtwrap" id="popwrap"></div><div class="stat" id="ps" style="margin-top:6px"></div></div>
<div class="p foot">
 <span>KOČNICA aktivnih paukova</span><input type="range" id="brk" min="1" max="30" value="6"> <em id="brkv" style="color:var(--am)">6</em>
 <button id="pz">⏸ pauza</button><button id="spd">brzina ×1</button><span class="stat" id="msg"></span>
</div>
<script>
'use strict';
const NS='http://www.w3.org/2000/svg',$=id=>document.getElementById(id),MAXN=300;
let paused=false,speed=1,nodes=[],edges=[],byKey={},root=null,popView=null,mainView=null,lang='sr',capLogged=false;
const key=t=>t.toLowerCase(),esc=s=>s.replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const act=()=>nodes.filter(n=>n.st==='fetch'||n.st==='crawl').length;
const T0=Date.now();
function log(t){const d=document.createElement('div');const s=((Date.now()-T0)/1000|0);d.innerHTML='<span>['+String(s/60|0).padStart(2,'0')+':'+String(s%60).padStart(2,'0')+']</span> '+t;$('lg2').prepend(d);while($('lg2').children.length>60)$('lg2').lastChild.remove()}
// ---------- Wikipedia ----------
const LC={a:'а',b:'б',v:'в',g:'г',d:'д',đ:'ђ',e:'е',ž:'ж',z:'з',i:'и',j:'ј',k:'к',l:'л',m:'м',n:'н',o:'о',p:'п',r:'р',s:'с',t:'т',ć:'ћ',u:'у',f:'ф',h:'х',c:'ц',č:'ч',š:'ш'};
function toCyr(t){let o='';for(let i=0;i<t.length;i++){const c=t[i],lo=c.toLowerCase(),two=t.slice(i,i+2).toLowerCase();let r;
 if(two==='lj'||two==='nj'||two==='dž'){r=two==='lj'?'љ':two==='nj'?'њ':'џ';i++}else r=LC[lo];if(!r){o+=c;continue}o+=c!==lo?r.toUpperCase():r}return o}
const api=(q)=>'https://'+lang+'.wikipedia.org/w/api.php?format=json&origin=*&formatversion=2&'+q;
async function jget(u){const r=await fetch(u);if(!r.ok)throw new Error('HTTP '+r.status);return r.json()}
async function parseTry(title){return jget(api('action=parse&redirects=1&disableeditsection=1&prop=text&page='+encodeURIComponent(title)+(lang==='sr'?'&variant=sr-el':'')))}
async function fetchPage(title,find){
 if(find){const s=await jget(api('action=query&list=search&srlimit=5&srsearch='+encodeURIComponent(title)));const h=(s.query&&s.query.search)||[];
  if(!h.length)throw new Error('ništa nije nađeno za „'+title+'“');
  if(h.length>1)log('ostali rezultati: '+h.slice(1).map(x=>'<a class="alt" data-q="'+esc(x.title)+'">'+esc(x.title)+'</a>').join(' · '));
  title=h[0].title}
 let j=await parseTry(title);
 if(!j.parse&&j.error&&j.error.code==='missingtitle'){
  if(lang==='sr'){const c=toCyr(title);if(c!==title)j=await parseTry(c)}
  if(!j.parse){const s=await jget(api('action=query&list=search&srlimit=1&srsearch='+encodeURIComponent(title)));const h=s.query&&s.query.search&&s.query.search[0];if(h){j=await parseTry(h.title)}}}
 if(!j.parse)throw new Error(j.error&&j.error.info||'nema članka');
 const doc=new DOMParser().parseFromString(j.parse.text,'text/html'),links=[],seen={};
 function walk(n){let o='';for(const c of n.childNodes){if(c.nodeType===3)o+=esc(c.textContent);else if(c.nodeType===1){const tg=c.tagName;
  if(tg==='SUP'||tg==='STYLE'||tg==='SCRIPT')continue;
  if(tg==='A'){const h=c.getAttribute('href')||'';if(h.startsWith('/wiki/')&&!h.slice(6).includes(':')){const t=decodeURIComponent(h.slice(6).split('#')[0]).replace(/_/g,' ');if(t&&c.textContent.trim()){if(!seen[key(t)]){seen[key(t)]=1;if(links.length<14)links.push(t)}o+='<a data-t="'+esc(t)+'">'+esc(c.textContent)+'</a>';continue}}o+=esc(c.textContent)}
  else o+=walk(c)}}return o}
 const paras=[];for(const p of doc.querySelectorAll('.mw-parser-output > p')){if(p.textContent.trim().length<40)continue;paras.push(walk(p));if(paras.length>=3||links.length>=14)break}
 // linkovi se čuvaju samo ako ih ima u prikazanom tekstu
 const shown=paras.join('');const L=links.filter(t=>shown.includes('data-t="'+esc(t)+'"'));
 return{title:j.parse.title,paras,links:L}}
// ---------- čvorovi / mreža ----------
function radius(d){return d?220*(1-Math.exp(-d*.42)):0}
function mkNode(title,parent,a0,a1){const d=parent?parent.depth+1:0,ang=(a0+a1)/2+(parent?(Math.random()-.5)*(a1-a0)*.3:0),r=radius(d)+(d?(Math.random()-.5)*10:0);
 const n={title,depth:d,parent,a0,a1,x:Math.cos(ang)*r,y:Math.sin(ang)*r,st:'queued',paras:[],links:[],idx:0,tmr:0,kids:[],view:null};
 const g=document.createElementNS(NS,'g');g.setAttribute('class','vn');const rr=d?Math.max(2.5,8-d*1.3):12;
 g.innerHTML='<circle cx="'+n.x+'" cy="'+n.y+'" r="'+rr+'"/>'+(d<=1?'<text x="'+(n.x+10)+'" y="'+(n.y+3)+'">'+esc(title)+'</text>':'')+'<title>'+esc(title)+'</title>';
 g.onclick=()=>openPop(n);vg.appendChild(g);n.g=g;nodes.push(n);byKey[key(title)]=n;if(parent)edge(parent,n,false);return n}
const vg=$('vg'),eg=$('eg');
function edge(a,b,dup){const l=document.createElementNS(NS,'line');l.setAttribute('x1',a.x);l.setAttribute('y1',a.y);l.setAttribute('x2',b.x);l.setAttribute('y2',b.y);l.setAttribute('class','ed2'+(dup?' dup':''));l.style.setProperty('--l',Math.hypot(b.x-a.x,b.y-a.y)+2);eg.appendChild(l);edges.push([a,b])}
function setSt(n,st){n.st=st;n.g.setAttribute('class','vn '+(st==='crawl'||st==='fetch'?'act':st==='done'?'done':st==='err'?'err':''))}
async function load(n){setSt(n,'fetch');try{const p=await fetchPage(n.title,n===root);if(n.st==='dead')return;if(n===root){delete byKey[key(n.title)];n.title=p.title;byKey[key(p.title)]=n;$('ht').textContent=p.title;const tt=n.g.querySelector('title');if(tt)tt.textContent=p.title;log('pauk kreće od članka „'+esc(p.title)+'“')}n.paras=p.paras;n.links=p.links;
  const w=(n.a1-n.a0)/Math.max(1,n.links.length);n.sec=n.links.map((_,i)=>[n.a0+i*w,n.a0+(i+1)*w]);
  if(!n.links.length){setSt(n,'done')}else setSt(n,'crawl');
  if(n.view)n.view.sync()}
 catch(e){if(n.st==='dead')return;setSt(n,'err');log('greška „'+esc(n.title)+'“: '+esc(e.message));if(n===root)$('mainwrap').querySelector('.txt').innerHTML='<i>Greška: '+esc(e.message)+'. Ako je u pitanju CORS/mreža, otvori fajl u običnom brauzeru sa internetom.</i>'}}
function openLink(n,i){const t=n.links[i],ex=byKey[key(t)];
 if(ex){if(ex!==n&&!edges.some(e=>e[0]===n&&e[1]===ex)){edge(n,ex,true);log('„'+esc(t)+'“ već postoji → nova veza, bez novog čvora')}return}
 if(nodes.length>=MAXN){if(!capLogged){capLogged=true;log('dostignut limit od '+MAXN+' čvorova (zaštita prikaza)')}return}
 const s=n.sec[i];const c=mkNode(t,n,s[0],s[1]);n.kids.push(c);log('pauk rođen na „'+esc(t)+'“ (dubina '+c.depth+', iz „'+esc(n.title)+'“)')}
function sched(dt){let free=+$('brk').value-act();
 for(const n of nodes){if(free<=0)break;if(n.st==='queued'){load(n);free--}}
 for(const n of nodes){if(n.st!=='crawl'||n.view)continue;n.tmr+=dt;if(n.tmr>=1.1){n.tmr=0;openLink(n,n.idx++);if(n.idx>=n.links.length)setSt(n,'done')}}}
// ---------- pauk (pogled na jedan čvor) ----------
const L1=50,L2=58,HX=[14,5,-5,-14],FX=[56,28,-14,-50],LAT=[46,60,60,48];
const rot=(x,y,a)=>[x*Math.cos(a)-y*Math.sin(a),x*Math.sin(a)+y*Math.cos(a)];
const rnd=(n,f)=>Array.from({length:n},f);
const ABD=rnd(300,()=>{const t=Math.random()*6.283,r=Math.sqrt(Math.random());return{x:-17+Math.cos(t)*r*19,y:Math.sin(t)*r*14,p:Math.random()*9}});
const THX=rnd(150,()=>{const t=Math.random()*6.283,r=Math.sqrt(Math.random());return{x:9+Math.cos(t)*r*11,y:Math.sin(t)*r*9,p:Math.random()*9}});
class View{
 constructor(wrap,node){this.w=wrap;this.n=node;node.view=this;wrap.innerHTML='<canvas class="cv"></canvas><div class="txt"></div>';this.cv=wrap.querySelector('canvas');this.cv.style.cssText='position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:3';this.ctx=this.cv.getContext('2d');this.txt=wrap.querySelector('.txt');
  this.rip=[];this.burst=[];this.T=0;this.mode='walk';this.dwell=0;this.tapT=0;this.sp=null;this.sync()}
 destroy(){this.n.view=null}
 sync(){const n=this.n;if(n.st==='fetch'||n.st==='queued'){this.txt.innerHTML='<i>pauk čeka tekst „'+esc(n.title)+'“ …</i>';this.sp=null;return}
  if(n.st==='err'){return}
  this.txt.innerHTML=n.paras.map(p=>'<p style="margin-bottom:.6em">'+p+'</p>').join('');
  this.A=n.links.map(t=>[...this.txt.querySelectorAll('a')].filter(a=>a.dataset.t===t));
  n.links.forEach((t,i)=>{if(i<n.idx)this.A[i].forEach(a=>a.classList.add('opened'))});
  this.resize();const tg=this.tr(Math.min(n.idx,n.links.length-1));const x=tg?Math.max(30,tg.x-60):40,y=tg?tg.y+30:this.H*.7;
  this.sp={x,y,a:0,vx:0,vy:0,legs:[]};for(let k=0;k<4;k++)for(const s of[-1,1])this.sp.legs.push({k,s,g:(k+(s>0?1:0))%2,fx:0,fy:0,st:null,lift:0});this.sp.legs.forEach(l=>{const[a,b]=this.rest(l);l.fx=a;l.fy=b});
  this.mode=n.idx>=n.links.length?'end':'walk'}
 resize(){const d=devicePixelRatio||1;this.W=this.w.clientWidth;this.H=this.w.clientHeight;this.cv.width=this.W*d;this.cv.height=this.H*d;this.ctx.setTransform(d,0,0,d,0,0)}
 tr(i){const a=this.A&&this.A[i]&&this.A[i][0];if(!a)return null;const r=a.getBoundingClientRect(),b=this.w.getBoundingClientRect();return{x:r.left-b.left,y:r.top-b.top,w:r.width,h:r.height}}
 hip(l){const s=this.sp,[x,y]=rot(HX[l.k],l.s*9,s.a);return[s.x+x,s.y+y]}
 rest(l){const s=this.sp,[x,y]=rot(FX[l.k],l.s*LAT[l.k],s.a);return[s.x+x+s.vx*.28,s.y+y+s.vy*.28]}
 land(l){this.rip.push({x:l.fx,y:l.fy,t:0});if(!this.A)return;this.A.forEach((as,i)=>{if(i<this.n.idx)return;for(const a of as){const r=this.rr(a);if(l.fx>r.x-6&&l.fx<r.x+r.w+6&&l.fy>r.y-6&&l.fy<r.y+r.h+6){a.classList.add('glow');clearTimeout(a._t);a._t=setTimeout(()=>a.classList.remove('glow'),700)}}})}
 rr(a){const r=a.getBoundingClientRect(),b=this.w.getBoundingClientRect();return{x:r.left-b.left,y:r.top-b.top,w:r.width,h:r.height}}
 step(l,tx,ty,d){l.st={fx:l.fx,fy:l.fy,tx,ty,t:0,d:d||.17}}
 frame(dt){const n=this.n,ctx=this.ctx,sp=this.sp;this.T+=dt;const T=this.T;ctx.clearRect(0,0,this.W,this.H);if(!sp)return;
  const tgs=this.A&&this.A[n.idx],tg=tgs&&tgs[0],tr=tg&&this.tr(n.idx);
  if(this.mode==='walk'&&tr){const gx=tr.x+tr.w/2,gy=tr.y+tr.h/2+10,dx=gx-sp.x,dy=gy-sp.y,d=Math.hypot(dx,dy);
   if(d<16){this.mode='dwell';this.dwell=1.5;this.tapT=0;sp.vx=sp.vy=0}else{const v=Math.min(80,d*3+20)*1;sp.vx=dx/d*v;sp.vy=dy/d*v;sp.x+=sp.vx*dt;sp.y+=sp.vy*dt;let da=Math.atan2(dy,dx)-sp.a;da=Math.atan2(Math.sin(da),Math.cos(da));sp.a+=da*Math.min(1,dt*5)}}
  else if(this.mode==='dwell'&&tr){this.dwell-=dt;this.tapT-=dt;
   if(this.tapT<=0){this.tapT=.26;for(const l of sp.legs)if(l.k===0&&!l.st){const[hx,hy]=this.hip(l);let x=tr.x+Math.random()*tr.w,y=tr.y+tr.h*.3+Math.random()*tr.h*.6;const dd=Math.hypot(x-hx,y-hy);if(dd>L1+L2-6){x=hx+(x-hx)/dd*(L1+L2-6);y=hy+(y-hy)/dd*(L1+L2-6)}this.step(l,x,y,.12)}}
   if(this.dwell<1.1)tgs.forEach(a=>a.classList.add('glow'));
   if(this.dwell<=0){tgs.forEach(a=>{a.classList.remove('glow');a.classList.add('opened')});
    for(let i=0;i<60;i++){const t=Math.random()*6.28,v=40+Math.random()*120;this.burst.push({x:tr.x+tr.w/2,y:tr.y+tr.h/2,vx:Math.cos(t)*v,vy:Math.sin(t)*v,l:1})}
    const i=n.idx++;openLink(n,i);this.mode='walk';if(n.idx>=n.links.length){this.mode='end';setSt(n,'done')}}}
  const busy=[0,0];sp.legs.forEach(l=>{if(l.st)busy[l.g]++});
  for(const l of sp.legs){const[hx,hy]=this.hip(l);
   if(l.st){l.st.t+=dt/l.st.d;const t=Math.min(1,l.st.t);l.fx=l.st.fx+(l.st.tx-l.st.fx)*t;l.fy=l.st.fy+(l.st.ty-l.st.fy)*t;l.lift=Math.sin(Math.PI*t)*(this.mode==='dwell'&&l.k===0?16:12);if(t>=1){l.fx=l.st.tx;l.fy=l.st.ty;l.st=null;l.lift=0;this.land(l)}}
   else{l.lift=0;const[rx,ry]=this.rest(l),d=Math.hypot(l.fx-rx,l.fy-ry),far=Math.hypot(l.fx-hx,l.fy-hy)>(L1+L2)*.93;if(!(this.mode==='dwell'&&l.k===0)&&(d>30||far)&&(!busy[1-l.g]||far)){this.step(l,rx,ry);busy[l.g]++}}}
  ctx.globalCompositeOperation='lighter';
  const bit=(x,y,sz,c,a)=>{ctx.fillStyle=c;ctx.globalAlpha=a;ctx.fillRect(x-sz/2,y-sz/2,sz,sz)};
  for(const l of sp.legs){const[hx,hy]=this.hip(l),fx=l.fx,fy=l.fy-l.lift;const raw=Math.hypot(fx-hx,fy-hy)||1e-6;let d=Math.max(Math.abs(L1-L2)+1,Math.min(L1+L2-.5,raw));const ux=(fx-hx)/raw,uy=(fy-hy)/raw;
   const aa=(L1*L1-L2*L2+d*d)/(2*d),hh=Math.sqrt(Math.max(0,L1*L1-aa*aa));const k1=[hx+ux*aa-uy*hh,hy+uy*aa+ux*hh],k2=[hx+ux*aa+uy*hh,hy+uy*aa-ux*hh],[kx,ky]=k1[1]<k2[1]?k1:k2;
   const seg=(ax,ay,bx,by,ph)=>{const m=Math.max(8,Math.hypot(bx-ax,by-ay)/1.7|0);for(let i=0;i<=m;i++){const t=i/m,j=Math.sin(T*7+i*2.1+ph)*1.3,k=Math.cos(T*6+i*1.7+ph)*1.3;bit(ax+(bx-ax)*t+j,ay+(by-ay)*t+k,i%3?2.1:3,'#3df0ff',.55+.4*Math.sin(T*9+i))}};
   seg(hx,hy,kx,ky,l.k);seg(kx,ky,fx,fy,l.k+3);
   for(let i=0;i<7;i++)bit(kx+Math.cos(T*8+i)*2.2,ky+Math.sin(T*8+i*2)*2.2,2.2,'#ffb347',.9);
   if(l.st||(l.k===0&&this.mode==='dwell'))for(let i=0;i<6;i++)bit(fx+Math.cos(T*10+i)*3,fy+Math.sin(T*10+i*2)*3,2,'#fff',.9)}
  const ca=Math.cos(sp.a),sa=Math.sin(sp.a),bob=Math.sin(T*10)*(Math.hypot(sp.vx,sp.vy)>5?1.2:.4);
  const draw=(arr,c)=>{for(const q of arr){const x=q.x+Math.sin(T*3+q.p)*1.6,y=q.y+Math.cos(T*3.7+q.p*1.3)*1.6;bit(sp.x+x*ca-y*sa,sp.y+x*sa+y*ca+bob,2.3,c,.6+.35*Math.sin(T*5+q.p))}};
  draw(ABD,'#3df0ff');draw(THX,'#9ff6ff');for(const s of[-1,1]){const x=17,y=s*4;bit(sp.x+x*ca-y*sa,sp.y+x*sa+y*ca,3.5,'#ffb347',1)}
  for(let i=this.rip.length-1;i>=0;i--){const r=this.rip[i];r.t+=dt;if(r.t>.5){this.rip.splice(i,1);continue}ctx.globalAlpha=1-r.t*2;ctx.strokeStyle='#3df0ff';ctx.beginPath();ctx.arc(r.x,r.y,4+r.t*34,0,6.28);ctx.stroke()}
  for(let i=this.burst.length-1;i>=0;i--){const b=this.burst[i];b.l-=dt*1.1;if(b.l<=0){this.burst.splice(i,1);continue}b.x+=b.vx*dt;b.y+=b.vy*dt;b.vx*=.96;b.vy*=.96;bit(b.x,b.y,2,'#ffb347',b.l)}
  ctx.globalAlpha=1;ctx.globalCompositeOperation='source-over'}}
// ---------- popup ----------
function openPop(n){if(n.view===mainView&&mainView){$('msg').textContent='ovo je glavni pauk — gledaj levo';return}
 closePop();popNode=n;$('pop').style.display='block';$('ph').innerHTML='◢ pauk — „'+esc(n.title)+'“ <span class="sp"></span> ';popView=new View($('popwrap'),n)}
let popNode=null;function closePop(){if(popView){popView.destroy();popView=null}popNode=null;$('pop').style.display='none'}
$('px').onclick=closePop;
// ---------- start / petlja ----------
function start(){closePop();nodes.forEach(n=>n.st='dead');if(mainView)mainView.destroy();nodes=[];edges=[];byKey={};vg.innerHTML=eg.innerHTML='';$('lg2').innerHTML='';capLogged=false;lang=$('lg').value;
 const t=$('q').value.trim()||'Nikola Tesla';root=mkNode(t,null,0,Math.PI*2);root.x=root.y=0;root.g.innerHTML='<circle class="home" cx="0" cy="0" r="12" style="fill:#ffb34733;stroke:var(--am);stroke-width:2.5"/><text y="-17" text-anchor="middle">HOME</text><title>'+esc(t)+'</title>';root.g.onclick=()=>openPop(root);
 $('ht').textContent=t;mainView=new View($('mainwrap'),root);log('traži „'+esc(t)+'“ na '+lang+'.wikipedia.org')}
$('lg2').onclick=e=>{const q=e.target.dataset&&e.target.dataset.q;if(q){$('q').value=q;start()}};$('go').onclick=start;$('q').onkeydown=e=>{if(e.key==='Enter')start()};
$('brk').oninput=e=>$('brkv').textContent=e.target.value;
$('pz').onclick=()=>{paused=!paused;$('pz').textContent=paused?'▶ nastavi':'⏸ pauza'};
$('spd').onclick=()=>{speed=speed===1?2:speed===2?4:1;$('spd').textContent='brzina ×'+speed};
addEventListener('resize',()=>{mainView&&mainView.sync();popView&&popView.sync()});
let last=0,acc=0;function loop(now){const dt=Math.min(.05,(now-(last||now))/1000)*speed;last=now;if(!paused){sched(dt);mainView&&mainView.frame(dt);popView&&popView.frame(dt)}
 acc+=dt;if(acc>.3){acc=0;$('sA').textContent=act();$('sN').textContent=nodes.length;$('sE').textContent=edges.length;$('sD').textContent=nodes.reduce((m,n)=>Math.max(m,n.depth),0);
  if(popNode)$('ps').innerHTML='dubina <em>'+popNode.depth+'</em> · linkova <em>'+popNode.links.length+'</em> · obrađeno <em>'+popNode.idx+'</em> · stanje <em>'+popNode.st+'</em>'}
 requestAnimationFrame(loop)}
start();requestAnimationFrame(loop);
